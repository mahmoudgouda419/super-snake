<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SUPER-SNAKE</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="score">Score: <span>0</span></div>
<div id="game">
    <div class="apple"></div>
    <h1>SUPER-SNAKE</h1>
    <h3>Choose the speed
    <select id="custom-select" value="3">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>
    </h3>
    <br>
    <h2 class="title2">Press any key to play</h2>
    <h2 class="score2"></h2>
    <div class="flex">
        <div class="column">
            <img alt="arrow-keys" class="arrow-keys" src="img/arrow-keys3.png" />
            <h3>Direction</h3>
        </div>
        <div class="column">
            <img alt="space-key" class="space-key" src="img/space-key.png" />
            <h3>Press Space to pause the game</h3>
        </div>
    </div>
</div>

</body>



</html>
<script src="script.js"></script>
